# Vercel Style
name: "Vercel"
philosophy: "Black and white precision, Geist font. Zero-radius aesthetic for deployment platforms."
primary_mode: "dark"
brand_domain: "deployment / infrastructure"
brand_type: "ui-rich"

diales:
  variance: 3
  motion: 4
  density: 4

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#FAFAFA"
      200: "#E5E5E5"
      300: "#D4D4D4"
      400: "#A3A3A3"
      500: "#737373"
      600: "#525252"
      700: "#404040"
      800: "#262626"
      900: "#171717"
      950: "#09090B"
    brand:
      500: "#FFFFFF"
      600: "#E5E5E5"

  radii: [0, 4, 8]

tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      border: "{neutral.800}"
      text1: "#FFFFFF"
      text2: "{neutral.400}"
      accent: "#FFFFFF"
    light:
      background: "#FFFFFF"
      surface1: "#FAFAFA"
      border: "{neutral.200}"
      text1: "{neutral.950}"
      text2: "{neutral.500}"

  typography:
    display:
      family: "Geist"
      size: "48px"
      weight: 500
      line_height: 1.05
      letter_spacing: "-0.03em"
    body:
      family: "Geist"
      size: "16px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
    mono:
      family: "Geist Mono"
      size: "13px"
      line_height: 1.6
      letter_spacing: "0em"
  google_fonts: ["Geist", "Geist Mono"]

layout:
  grid: "grid-cols-1 lg:grid-cols-[1fr_1fr]"
  hero_pattern: "centered"
  content_width: "1200px"
  section_spacing: "128px"
  variance_mapping:
    low: "Centered single column, generous whitespace, minimal decoration"
    mid: "Centered hero with feature cards in symmetric grid below"
    high: "Full-bleed sections with edge-to-edge code previews, staggered logos"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "Center text, shrink display to 32px, hide decorative grid"
  mobile_nav: "Hamburger with full-screen overlay nav"
  mobile_grid: "Single column stack, reduced spacing"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "surface1 → surface2"
  focus:
    ring: "2px solid #FFFFFF"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "#FFFFFF"
    color: "#09090B"
    radius: 0
    padding: "12px 24px"
    font_weight: 500
  button_secondary:
    background: "transparent"
    border: "1px solid {neutral.700}"
    radius: 0
  card:
    background: "{neutral.900}"
    border: "1px solid {neutral.800}"
    radius: 8

hero_stage:
  preset: "grid-on-dark"
  background:
    medium: "pattern"
    pattern_type: "dot-grid"