# Revolut Style
name: "Revolut"
philosophy: "Sleek dark interface, gradient cards. Fintech precision with modern banking aesthetic."
primary_mode: "dark"
brand_domain: "fintech / banking"
brand_type: "ui-rich"

diales:
  variance: 5
  motion: 6
  density: 6

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F5F5F5"
      200: "#E8E8E8"
      400: "#8E8E93"
      500: "#636366"
      700: "#3A3A3C"
      800: "#2C2C2E"
      900: "#1C1C1E"
      950: "#0A0A0A"
    brand:
      400: "#06B6D4"
      500: "#0891B2"
      600: "#0E7490"

  radii: [0, 8, 12, 16]

tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      border: "{neutral.700}"
      text1: "#FFFFFF"
      text2: "{neutral.400}"
      accent: "{brand.400}"

  typography:
    display:
      family: "Geist"
      size: "40px"
      weight: 600
      line_height: 1.1
      letter_spacing: "-0.02em"
    body:
      family: "Plus Jakarta Sans"
      size: "16px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"

google_fonts:
  - "Geist:wght@400;500;600;700"
  - "Plus Jakarta Sans:wght@400;500;600;700"

layout:
  grid: "1fr min(1168px, 100%) 1fr"
  hero_pattern: "split-right"
  content_width: "1168px"
  section_spacing: "100px"
  variance_mapping:
    low: "stacked cards with subtle gradients"
    mid: "dashboard grid with stat highlights"
    high: "floating card layout with glassmorphism"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "centered with card preview"
  mobile_nav: "bottom tab bar with fab"
  mobile_grid: "single column swipeable cards"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "lighten 6%"
  focus:
    ring: "2px solid {brand.400}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    radius: 12
    padding: "14px 28px"
  card:
    background: "linear-gradient(135deg, {neutral.800}, {neutral.900})"
    border: "none"
    radius: 16
  input:
    background: "{neutral.900}"
    border: "none"
    radius: 12

hero_stage:
  preset: "sculptural-field"