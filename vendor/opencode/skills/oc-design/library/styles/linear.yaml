# Linear Style
name: "Linear"
philosophy: "Ultra-minimal, precise, keyboard-first. Emerald accent as a signal device on monochrome canvas."
primary_mode: "dark"
brand_domain: "project management / issue tracking"
brand_type: "ui-rich"

diales:
  variance: 6
  motion: 5
  density: 7

primitives:
  colors:
    neutral:
      50: "#F8FAFC"
      100: "#F1F5F9"
      200: "#E2E8F0"
      300: "#CBD5E1"
      400: "#94A3B8"
      500: "#64748B"
      600: "#475569"
      700: "#334155"
      800: "#1E293B"
      900: "#0F172A"
      950: "#020617"
    brand:
      400: "#34D399"
      500: "#10B981"
      600: "#059669"

  radii: [0, 2, 4, 6, 8, 12]

tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      border: "{neutral.800}"
      text1: "#FFFFFF"
      text2: "{neutral.400}"
      accent: "{brand.400}"

  typography:
    display:
      family: "Geist"
      size: "32px"
      weight: 600
      line_height: 1.1
      letter_spacing: "-0.02em"
    body:
      family: "Geist"
      size: "14px"
      weight: 400
      line_height: 1.5
      letter_spacing: "0em"
    mono:
      family: "Geist Mono"
      size: "12px"
      line_height: 1.6
      letter_spacing: "0em"
  google_fonts: ["Geist", "Geist Mono"]

layout:
  grid: "grid-cols-[1fr_3fr] lg:grid-cols-[2fr_1fr]"
  hero_pattern: "split-left"
  content_width: "1152px"
  section_spacing: "96px"
  variance_mapping:
    low: "Symmetric two-column, balanced sidebar-content layout"
    mid: "Asymmetric split with narrower sidebar, staggered detail rows"
    high: "Wide command palette center, rail navigation, zooming detail panels"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "Stack vertically, shrink display to 24px, hide secondary elements"
  mobile_nav: "Bottom sheet with keyboard shortcut overlay, hidden sidebar"
  mobile_grid: "Single column stack, detail panels become full-screen overlays"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "surface1 → surface2"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    radius: 6
    padding: "8px 16px"
  card:
    background: "{neutral.900}"
    border: "1px solid {neutral.800}"
    radius: 8
    shadow: "none"
  input:
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: 6

hero_stage:
  preset: "device-on-mesh"
  background:
    medium: "mesh"
    color_mode: "brand-tinted"
  hero:
    subject: "device"