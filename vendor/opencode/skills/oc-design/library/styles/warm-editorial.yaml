# Warm Editorial Style
name: "WarmEditorial"
philosophy: "Cream backgrounds, serif elegance. Content-focused with warm, inviting typography and subtle depth."
primary_mode: "light"
brand_domain: "editorial / blog / portfolio"
brand_type: "content-rich"

diales:
  variance: 6
  motion: 5
  density: 3

primitives:
  colors:
    neutral:
      50: "#FFFBF5"
      100: "#F5F0E8"
      200: "#E8E0D5"
      300: "#D4C9B8"
      400: "#B8A98E"
      500: "#9A8673"
      600: "#7A6655"
      700: "#5C4D40"
      800: "#3A322A"
      900: "#1F1A16"
    brand:
      400: "#C4956A"
      500: "#A67C52"
      600: "#8B6342"

  radii: [0, 4, 8, 12]

tokens:
  colors:
    light:
      background: "{neutral.50}"
      surface1: "{neutral.100}"
      border: "{neutral.200}"
      text1: "{neutral.800}"
      text2: "{neutral.500}"
      accent: "{brand.500}"

  typography:
    display:
      family: "Cabinet Grotesk"
      size: "48px"
      weight: 600
      line_height: 1.1
      letter_spacing: "-0.02em"
    body:
      family: "Outfit"
      size: "17px"
      weight: 400
      line_height: 1.7
      letter_spacing: "0.01em"
    mono:
      family: "Geist Mono"
      size: "14px"
      line_height: 1.5
      letter_spacing: "0.02em"

google_fonts:
  - "Cabinet Grotesk:wght@400;500;600;700"
  - "Outfit:wght@400;500;600"
  - "Geist Mono"

layout:
  grid: "1fr min(720px, 100%) 1fr"
  hero_pattern: "editorial"
  content_width: "720px"
  section_spacing: "100px"
  variance_mapping:
    low: "single-column prose layout"
    mid: "asymmetric with pull quotes"
    high: "magazine-style with sidebars and asides"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "stacked with warm gradient"
  mobile_nav: "minimal top bar with hamburger"
  mobile_grid: "single column, generous margins"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "warm lighten 4%"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    radius: 8
    padding: "12px 24px"
  card:
    background: "#FFFFFF"
    border: "1px solid {neutral.200}"
    radius: 12
    shadow: "0 4px 12px rgba(0,0,0,0.05)"
  input:
    background: "#FFFFFF"
    border: "1px solid {neutral.300}"
    radius: 8

hero_stage:
  preset: "painterly-no-hero"