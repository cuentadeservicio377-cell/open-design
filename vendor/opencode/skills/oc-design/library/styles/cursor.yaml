# Cursor Style
name: "Cursor"
philosophy: "AI-first code editor. Dark interface with emerald gradient accents. Developer-centric with glow elements."
primary_mode: "dark"
brand_domain: "developer tools / IDE"
brand_type: "ui-rich"

diales:
  variance: 7
  motion: 8
  density: 6

primitives:
  colors:
    neutral:
      50: "#F5F5F5"
      100: "#E5E5E5"
      200: "#D4D4D4"
      300: "#A3A3A3"
      400: "#737373"
      500: "#525252"
      600: "#404040"
      700: "#262626"
      800: "#171717"
      900: "#0A0A0A"
      950: "#050505"
    brand:
      400: "#34D399"
      500: "#10B981"
      600: "#059669"

  radii: [0, 4, 8, 12, 999]

tokens:
  colors:
    dark:
      background: "{neutral.900}"
      surface1: "{neutral.800}"
      surface2: "{neutral.700}"
      border: "{neutral.700}"
      text1: "#FFFFFF"
      text2: "{neutral.400}"
      accent: "{brand.400}"

  typography:
    display:
      family: "Geist"
      size: "28px"
      weight: 600
      line_height: 1.15
      letter_spacing: "-0.02em"
    body:
      family: "Geist"
      size: "14px"
      weight: 400
      line_height: 1.5
      letter_spacing: "0em"
    mono:
      family: "Geist Mono"
      size: "13px"
      line_height: 1.6
      letter_spacing: "0em"
  google_fonts: ["Geist", "Geist Mono"]

layout:
  grid: "grid-cols-[1fr_2fr] lg:grid-cols-[1fr_3fr]"
  hero_pattern: "split-left"
  content_width: "1200px"
  section_spacing: "80px"
  variance_mapping:
    low: "Centered hero, symmetric feature grid below"
    mid: "Sidebar with editor preview, staggered feature rows"
    high: "Floating command palette centered, animated terminal panels, parallax glow"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "Stack vertically, shrink code previews, hide glow effects"
  mobile_nav: "Hamburger slide-in, collapse tabs to bottom bar"
  mobile_grid: "Single column stack, code blocks full width"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "surface1 → surface2"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "linear-gradient(135deg, {brand.500}, {brand.400})"
    radius: 8
    padding: "10px 20px"
    hover:
      box_shadow: "0 0 20px rgba(16, 185, 129, 0.3)"
  card:
    background: "{neutral.800}"
    border: "1px solid {neutral.700}"
    radius: 12
  input:
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: 8

hero_stage:
  preset: "luminous-on-gradient"
  background:
    medium: "gradient"
    color_palette: ["#10B981", "#34D399", "#0A0A0A"]