# Spotify Style
name: "Spotify"
philosophy: "Vibrant green on dark, bold typography. Music-driven with album-art as visual identity."
primary_mode: "dark"
brand_domain: "media / music streaming"
brand_type: "content-rich"

diales:
  variance: 5
  motion: 7
  density: 6

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#B3B3B3"
      200: "#ADADAD"
      300: "#A7A7A7"
      400: "#A0A0A0"
      500: "#999999"
      600: "#737373"
      700: "#535353"
      800: "#333333"
      900: "#191414"
      950: "#121212"
    brand:
      400: "#1ED760"
      500: "#1DB954"
      600: "#1AA34A"

  radii: [0, 4, 8]

tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      border: "{neutral.700}"
      text1: "#FFFFFF"
      text2: "{neutral.100}"
      accent: "{brand.500}"

  typography:
    display:
      family: "Plus Jakarta Sans"
      size: "48px"
      weight: 900
      line_height: 1.05
      letter_spacing: "-0.02em"
    body:
      family: "Plus Jakarta Sans"
      size: "16px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
    mono:
      family: "Plus Jakarta Sans"
      size: "14px"
      line_height: 1.5
      letter_spacing: "0.01em"

google_fonts:
  - "Plus Jakarta Sans:wght@400;500;600;700;800;900"

layout:
  grid: "1fr min(1168px, 100%) 1fr"
  hero_pattern: "full-bleed"
  content_width: "1168px"
  section_spacing: "96px"
  variance_mapping:
    low: "list layout with album art"
    mid: "card grid with hover reveals"
    high: "dynamic mosaic with album-art backgrounds"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "full-bleed album art overlay"
  mobile_nav: "bottom tab bar"
  mobile_grid: "horizontal scroll cards"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "lighten 10%"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "scale(0.97)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    color: "#09090B"
    radius: 999
    padding: "14px 32px"
    font_weight: 700
  card:
    background: "{neutral.800}"
    border: "none"
    radius: 8
  input:
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: 4

hero_stage:
  preset: "editorial-photo"