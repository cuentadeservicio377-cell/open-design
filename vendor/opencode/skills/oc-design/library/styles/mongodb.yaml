# MongoDB Style
name: "MongoDB"
philosophy: "Green leaf branding, developer documentation focus. Document database with approachable tech aesthetic."
primary_mode: "light"
brand_domain: "database / infrastructure"
brand_type: "ui-rich"

diales:
  variance: 4
  motion: 4
  density: 5

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F5F5F5"
      200: "#E8E8E8"
      300: "#D4D4D4"
      400: "#A0A0A0"
      500: "#6E6E6E"
      600: "#4A4A4A"
      700: "#333333"
      800: "#1D1D1D"
      900: "#09090B"
    brand:
      300: "#6AA84F"
      400: "#4DB546"
      500: "#419B38"
      600: "#317D29"

  radii: [0, 4, 8]

tokens:
  colors:
    light:
      background: "#FFFFFF"
      surface1: "{neutral.100}"
      border: "{neutral.200}"
      text1: "{neutral.800}"
      text2: "{neutral.500}"
      accent: "{brand.500}"

  typography:
    display:
      family: "Geist"
      size: "36px"
      weight: 600
      line_height: 1.15
      letter_spacing: "-0.02em"
    body:
      family: "Geist"
      size: "16px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
    mono:
      family: "Geist Mono"
      size: "14px"
      line_height: 1.5
      letter_spacing: "0.02em"

google_fonts:
  - "Geist:wght@400;500;600;700"
  - "Geist Mono"

layout:
  grid: "1fr min(1120px, 100%) 1fr"
  hero_pattern: "centered"
  content_width: "1120px"
  section_spacing: "96px"
  variance_mapping:
    low: "single-column docs layout"
    mid: "sidebar + content with code blocks"
    high: "multi-panel with interactive examples"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "centered heading with leaf accent"
  mobile_nav: "hamburger with slide-out menu"
  mobile_grid: "single column, full-bleed cards"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "darken 4%"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    radius: 4
    padding: "12px 24px"
  card:
    background: "#FFFFFF"
    border: "1px solid {neutral.200}"
    radius: 8
  input:
    background: "#FFFFFF"
    border: "1px solid {neutral.300}"
    radius: 4

hero_stage:
  preset: "flat-blank"