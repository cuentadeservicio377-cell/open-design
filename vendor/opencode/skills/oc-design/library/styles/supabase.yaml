# Supabase Style
name: "Supabase"
philosophy: "Dark emerald theme, code-first. Open-source Firebase alternative with developer-focused aesthetic."
primary_mode: "dark"
brand_domain: "backend-as-a-service / database"
brand_type: "ui-rich"

diales:
  variance: 5
  motion: 5
  density: 6

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F8F8F8"
      200: "#E8E8E8"
      300: "#D4D4D4"
      400: "#A0A0A0"
      500: "#6E6E6E"
      600: "#404040"
      700: "#2A2A2A"
      800: "#1E1E1E"
      900: "#121212"
      950: "#0A0A0A"
    brand:
      300: "#3ECF8E"
      400: "#2EB67D"
      500: "#24B364"
      600: "#1A8A4C"

  radii: [0, 4, 6, 8]

tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      border: "{neutral.700}"
      text1: "#FFFFFF"
      text2: "{neutral.400}"
      accent: "{brand.400}"

  typography:
    display:
      family: "Geist"
      size: "40px"
      weight: 600
      line_height: 1.1
      letter_spacing: "-0.02em"
    body:
      family: "Geist"
      size: "15px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
    mono:
      family: "Geist Mono"
      size: "13px"
      line_height: 1.5
      letter_spacing: "0.02em"

google_fonts:
  - "Geist:wght@400;500;600;700"
  - "Geist Mono"

layout:
  grid: "1fr min(1120px, 100%) 1fr"
  hero_pattern: "split-left"
  content_width: "1120px"
  section_spacing: "96px"
  variance_mapping:
    low: "single-column docs layout"
    mid: "two-column with code sidebar"
    high: "dashboard grid with code previews"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "stacked with code snippet"
  mobile_nav: "hamburger with sidebar drawer"
  mobile_grid: "single column, stacked cards"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "lighten 6%"
  focus:
    ring: "2px solid {brand.400}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.400}"
    color: "#09090B"
    radius: 6
    padding: "10px 20px"
  card:
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: 8
  input:
    background: "{neutral.800}"
    border: "1px solid {neutral.700}"
    radius: 6

hero_stage:
  preset: "grid-on-dark"