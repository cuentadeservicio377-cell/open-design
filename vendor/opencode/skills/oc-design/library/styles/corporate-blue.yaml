# Corporate Blue Style
name: "CorporateBlue"
philosophy: "Professional, trustworthy, enterprise-ready. Navy and gold for B2B SaaS and corporate platforms."
primary_mode: "light"
brand_domain: "enterprise SaaS / B2B"
brand_type: "ui-rich"

diales:
  variance: 4
  motion: 4
  density: 5

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F8FAFC"
      200: "#E2E8F0"
      300: "#CBD5E1"
      400: "#94A3B8"
      500: "#64748B"
      600: "#475569"
      700: "#334155"
      800: "#1E293B"
      900: "#0F172A"
    brand:
      navy: "#1E3A5F"
      gold: "#C9A227"

  radii: [0, 4, 6, 8]

tokens:
  colors:
    light:
      background: "#FFFFFF"
      surface1: "{neutral.100}"
      border: "{neutral.200}"
      text1: "{neutral.800}"
      text2: "{neutral.500}"
      accent: "{brand.navy}"

  typography:
    display:
      family: "DM Sans"
      size: "40px"
      weight: 600
      line_height: 1.1
      letter_spacing: "-0.02em"
    body:
      family: "DM Sans"
      size: "16px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
    mono:
      family: "Geist Mono"
      size: "14px"
      line_height: 1.5
      letter_spacing: "0.02em"

google_fonts:
  - "DM Sans:wght@400;500;600;700"
  - "Geist Mono"

layout:
  grid: "1fr min(1120px, 100%) 1fr"
  hero_pattern: "split-left"
  content_width: "1120px"
  section_spacing: "96px"
  variance_mapping:
    low: "single-column centered with stats"
    mid: "two-column with sidebar nav"
    high: "dashboard grid with data panels"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "centered heading with CTA"
  mobile_nav: "hamburger with slide-out nav"
  mobile_grid: "single column, stacked sections"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "darken 4%"
  focus:
    ring: "2px solid {brand.navy}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.navy}"
    radius: 6
    padding: "12px 24px"
  button_secondary:
    background: "transparent"
    border: "1px solid {brand.navy}"
    color: "{brand.navy}"
    radius: 6
  card:
    background: "#FFFFFF"
    border: "1px solid {neutral.200}"
    radius: 8
  input:
    background: "#FFFFFF"
    border: "1px solid {neutral.300}"
    radius: 4

hero_stage:
  preset: "flat-blank"