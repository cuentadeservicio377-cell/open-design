# Airbnb Style
name: "Airbnb"
philosophy: "Warm coral accent, photography-driven. Travel marketplace with rounded, approachable UI."
primary_mode: "light"
brand_domain: "marketplace / travel"
brand_type: "content-rich"

diales:
  variance: 5
  motion: 5
  density: 4

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F7F7F7"
      200: "#EBEBEB"
      300: "#DDDDDD"
      400: "#B0B0B0"
      500: "#737373"
      600: "#484848"
      700: "#333333"
      800: "#222222"
      900: "#141414"
    brand:
      400: "#FF5A5F"
      500: "#FF385C"
      600: "#E31C5F"

  radii: [0, 4, 8, 12, 999]

tokens:
  colors:
    light:
      background: "#FFFFFF"
      surface1: "{neutral.100}"
      border: "{neutral.200}"
      text1: "{neutral.800}"
      text2: "{neutral.500}"
      accent: "{brand.500}"

  typography:
    display:
      family: "Plus Jakarta Sans"
      size: "48px"
      weight: 600
      line_height: 1.1
      letter_spacing: "-0.02em"
    body:
      family: "Plus Jakarta Sans"
      size: "16px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
  google_fonts: ["Plus Jakarta Sans"]

layout:
  grid: "grid-cols-1 lg:grid-cols-[1fr_1fr] xl:grid-cols-[1fr_1fr_1fr]"
  hero_pattern: "editorial-photo"
  content_width: "1200px"
  section_spacing: "96px"
  variance_mapping:
    low: "Centered hero with search bar, simple card grid below"
    mid: "Photo-forward cards with filter bar, map toggle, staggered layouts"
    high: "Asymmetric photo grids, saved trip sidebar, scroll-triggered destination reveals"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "Full-width search bar with compact destination carousel"
  mobile_nav: "Bottom tab bar with explore, wishlist, profile, inbox"
  mobile_grid: "Single column scroll, horizontal card carousel for categories"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "surface1 → surface2"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "scale(0.98)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    radius: 8
    padding: "14px 24px"
  button_secondary:
    background: "transparent"
    border: "1px solid {neutral.800}"
    radius: 8
  card:
    background: "#FFFFFF"
    border: "none"
    radius: 12
  input:
    background: "#FFFFFF"
    border: "1px solid {neutral.200}"
    radius: 999

hero_stage:
  preset: "editorial-photo"