# Lamborghini Style
name: "Lamborghini"
philosophy: "True black cathedral, gold accent. Hyper-luxury with aggressive angular geometry."
primary_mode: "dark"
brand_domain: "luxury automotive"
brand_type: "content-rich"

diales:
  variance: 4
  motion: 5
  density: 1

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      900: "#121212"
      950: "#09090B"
    brand:
      400: "#D4AF37"
      500: "#C9A227"
      600: "#A67C00"

  radii: [0, 2, 4]

tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      border: "#1A1A1A"
      text1: "#FFFFFF"
      text2: "#666666"
      accent: "{brand.500}"

  typography:
    display:
      family: "Cabinet Grotesk"
      size: "96px"
      weight: 700
      line_height: 0.9
      letter_spacing: "-0.05em"
    body:
      family: "Outfit"
      size: "14px"
      weight: 400
      line_height: 1.7
      letter_spacing: "0.02em"
  google_fonts: ["Cabinet Grotesk", "Outfit"]

layout:
  grid: "grid-cols-[1fr_2fr] lg:grid-cols-[1fr_4fr]"
  hero_pattern: "full-bleed"
  content_width: "1600px"
  section_spacing: "240px"
  variance_mapping:
    low: "Centered single element on pure black, extreme negative space"
    mid: "Left-aligned text with angular gold dividers, staggered content blocks"
    high: "Diagonal angular sections, parallax product reveals, gold accent lines cutting across viewport"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "Full-bleed with centered text, shrink display to 48px"
  mobile_nav: "Hamburger with gold accent line, minimal mobile header"
  mobile_grid: "Single column, expanded section spacing"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "transparent → surface1"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "scale(0.98)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    color: "#09090B"
    radius: 0
    padding: "18px 40px"
  card:
    background: "transparent"
    border: "1px solid {brand.500}"
    radius: 0

hero_stage:
  preset: "object-on-spotlight"