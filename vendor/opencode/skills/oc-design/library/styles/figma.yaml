# Figma Style
name: "Figma"
philosophy: "Vibrant multi-color, playful yet professional. Collaborative design tool with energetic palette."
primary_mode: "light"
brand_domain: "design tools / collaboration"
brand_type: "ui-rich"

diales:
  variance: 6
  motion: 6
  density: 6

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F5F5F5"
      200: "#E5E5E5"
      300: "#D4D4D4"
      400: "#A3A3A3"
      500: "#737373"
      600: "#525252"
      700: "#404040"
      800: "#262626"
      900: "#171717"
    brand:
      teal: "#0ACF83"
      blue: "#1ABCFE"
      orange: "#FF7262"
      red: "#F24E1E"

  radii: [0, 4, 8, 12]

tokens:
  colors:
    light:
      background: "#FFFFFF"
      surface1: "{neutral.100}"
      border: "{neutral.200}"
      text1: "{neutral.900}"
      text2: "{neutral.500}"
      accent: "{brand.teal}"

  typography:
    display:
      family: "Satoshi"
      size: "32px"
      weight: 600
      line_height: 1.15
      letter_spacing: "-0.02em"
    body:
      family: "DM Sans"
      size: "14px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
  google_fonts: ["DM Sans"]

layout:
  grid: "grid-cols-[1fr_1fr] lg:grid-cols-[1fr_2fr]"
  hero_pattern: "split-left"
  content_width: "1152px"
  section_spacing: "80px"
  variance_mapping:
    low: "Centered hero, symmetric feature grid, balanced whitespace"
    mid: "Left-aligned hero with illustrated canvas preview, staggered feature cards"
    high: "Interactive canvas mockup hero, floating UI elements, multi-color accent strips"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "Stack vertically, shrink illustration, simplify product mockup"
  mobile_nav: "Hamburger with slide-in drawer, simplified product menu"
  mobile_grid: "Single column, card carousel for features"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "surface1 → surface2"
  focus:
    ring: "2px solid {brand.teal}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.teal}"
    radius: 8
    padding: "10px 20px"
  card:
    background: "#FFFFFF"
    border: "1px solid {neutral.200}"
    radius: 12
  input:
    background: "{neutral.100}"
    border: "1px solid {neutral.300}"
    radius: 6

hero_stage:
  preset: "sculptural-field"