# Framer Style
name: "Framer"
philosophy: "Bold black and blue, motion-first. Website builder with design-forward aesthetic and smooth animations."
primary_mode: "dark"
brand_domain: "website builder / design"
brand_type: "ui-rich"

diales:
  variance: 7
  motion: 9
  density: 5

primitives:
  colors:
    neutral:
      50: "#FFFFFF"
      100: "#F5F5F5"
      400: "#888888"
      500: "#666666"
      700: "#333333"
      800: "#1A1A1A"
      900: "#0D0D0D"
      950: "#050505"
    brand:
      400: "#3B82F6"
      500: "#2563EB"
      600: "#1D4ED8"

  radii: [0, 8, 12, 16, 999]

tokens:
  colors:
    dark:
      background: "{neutral.950}"
      surface1: "{neutral.900}"
      surface2: "{neutral.800}"
      border: "{neutral.800}"
      text1: "#FFFFFF"
      text2: "{neutral.400}"
      accent: "{brand.400}"

  typography:
    display:
      family: "Satoshi"
      size: "56px"
      weight: 700
      line_height: 1.05
      letter_spacing: "-0.03em"
    body:
      family: "DM Sans"
      size: "16px"
      weight: 400
      line_height: 1.6
      letter_spacing: "0em"
    mono:
      family: "JetBrains Mono"
      size: "14px"
      line_height: 1.5
      letter_spacing: "0.02em"

google_fonts:
  - "Satoshi"
  - "DM Sans:wght@400;500;700"

layout:
  grid: "1fr min(1200px, 100%) 1fr"
  hero_pattern: "split-left"
  content_width: "1200px"
  section_spacing: "120px"
  variance_mapping:
    low: "single-column centered"
    mid: "two-column with sidebar"
    high: "asymmetric split with floating elements"

responsive:
  mobile_first: true
  breakpoints:
    sm: 640
    md: 768
    lg: 1024
    xl: 1280
  mobile_hero: "stacked with animated gradient"
  mobile_nav: "hamburger with slide-in panel"
  mobile_grid: "single column, full-width cards"

interaction_rules:
  hover:
    transition: "150ms cubic-bezier(0.16, 1, 0.3, 1)"
    background_shift: "lighten 8%"
  focus:
    ring: "2px solid {brand.500}"
    ring_offset: "2px"
  active:
    transform: "translateY(-1px)"
  disabled:
    opacity: 0.5
    cursor: "not-allowed"

components:
  button_primary:
    background: "{brand.500}"
    radius: 12
    padding: "14px 28px"
  card:
    background: "{neutral.900}"
    border: "none"
    radius: 16
  input:
    background: "{neutral.900}"
    border: "1px solid {neutral.700}"
    radius: 12

hero_stage:
  preset: "luminous-on-gradient"