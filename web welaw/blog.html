<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WS Archives | Intelligence Repository</title>
    <!-- Same elite fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=VT323&family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Blog Specific Polish */
        .archives-header { margin-bottom: 2rem; border-bottom: 2px dashed var(--plat-500); padding-bottom: 1rem; }
        .post-list { display: flex; flex-direction: column; gap: 1.5rem; }
        .post-card { 
            border: 2px solid var(--plat-900); 
            background: var(--plat-100); 
            padding: 1.5rem; 
            cursor: pointer; 
            transition: all 0.2s;
            box-shadow: 4px 4px 0px var(--plat-900);
        }
        .post-card:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px var(--plat-900); background: var(--plat-200); }
        .post-meta { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent-blue); margin-bottom: 0.5rem; }
        .post-title { font-family: var(--font-pixel); font-size: 1.8rem; margin-bottom: 0.5rem; }
        
        .article-reader { max-width: 800px; margin: 0 auto; }
        .article-content { line-height: 1.8; font-size: 1.15rem; }
        .article-content h2 { font-family: var(--font-pixel); font-size: 2rem; margin: 2rem 0 1rem 0; color: var(--accent-blue); }
        .article-content p { margin-bottom: 1.5rem; }
        
        .back-link { 
            display: inline-block; margin-bottom: 2rem; cursor: pointer; 
            font-family: var(--font-mono); font-weight: 700; color: var(--plat-900);
            text-decoration: none; border-bottom: 2px solid var(--plat-900);
        }
        .back-link:hover { color: var(--accent-red); border-color: var(--accent-red); }

        .loading-state { font-family: var(--font-pixel); font-size: 2rem; text-align: center; padding: 4rem; }
    </style>
</head>
<body class="retro-os-env">
    <header class="os-menubar">
        <div class="menu-cluster-left">
            <div class="ws-icon">◈</div>
            <div class="active-app">WS_ARCHIVES</div>
            <nav class="os-nav">
                <span class="nav-item"><a href="index.html">Home</a></span>
            </nav>
        </div>
        <div class="menu-cluster-right">
            <span class="os-widget" id="os-clock">00:00:00</span>
            <button id="i18n-switch" class="i18n-btn"><span class="lang-label">EN</span></button>
        </div>
    </header>

    <main class="desktop-env">
        <section class="os-window full-window fade-in-up visible">
            <div class="win-titlebar">
                <div class="win-controls">
                    <span class="win-btn close"></span><span class="win-btn"></span><span class="win-btn"></span>
                </div>
                <div class="win-title" id="archive-title">ARCHIVES:/NULL</div>
                <div class="win-lines"></div>
            </div>
            <div class="win-body" id="archive-content">
                <div class="loading-state">MOUNTING SYSTEM...</div>
            </div>
        </section>
    </main>

    <!-- Language Selector Modal (Retro Game Style) -->
    <div id="lng-modal" class="modal-overlay">
        <div class="window-bezel modal-window">
            <div class="window-header">
                <span class="window-title">System.Config.Language</span>
                <div class="window-controls">
                    <button class="win-btn close-modal">×</button>
                </div>
            </div>
            <div class="window-content modal-body text-center">
                <h2 class="pixel-heading sm mb-md">SELECT OPERATING LANGUAGE</h2>
                <div class="lang-grid">
                    <button class="lang-opt" data-lang="en">ENGLISH</button>
                    <button class="lang-opt" data-lang="es">ESPAÑOL</button>
                    <button class="lang-opt" data-lang="de">DEUTSCH</button>
                    <button class="lang-opt" data-lang="zh">中文</button>
                    <button class="lang-opt" data-lang="it">ITALIANO</button>
                    <button class="lang-opt" data-lang="ja">日本語</button>
                    <button class="lang-opt" data-lang="ar">العربية</button>
                    <button class="lang-opt" data-lang="pt">PORTUGUÊS</button>
                    <button class="lang-opt" data-lang="ko">한국어</button>
                </div>
            </div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script src="blog-app.js"></script>
</body>
</html>
